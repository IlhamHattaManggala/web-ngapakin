services:
  app:
    build: .
    image: ilhamhatta/larapak-go:latest
    container_name: web-ngapakin-app
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - APP_ENV=production
      - APP_DEBUG=salah
      - APP_PORT=8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=database.sqlite
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.larapak.rule=Host(`larapak.my.id`) || Host(`www.larapak.my.id`)"
      - "traefik.http.routers.larapak.entrypoints=websecure"
      - "traefik.http.routers.larapak.tls=true"
      - "traefik.http.routers.larapak.tls.certresolver=letsencrypt"
      - "traefik.http.services.larapak.loadbalancer.server.port=8000"

networks:
  proxy:
    external: true
